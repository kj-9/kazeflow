site_name: kazeflow
site_description: Reviewable task flows for ordinary Python scripts
site_url: https://kj-9.github.io/kazeflow/
repo_url: https://github.com/kj-9/kazeflow
repo_name: kj-9/kazeflow
edit_uri: edit/main/docs/user/

docs_dir: docs/user
site_dir: build/docs-site
use_directory_urls: false
strict: true

theme:
  name: material
  language: en
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: kazeflow-light
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - content.code.copy
    - content.code.annotate
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            heading_level: 2
            show_root_heading: true
            show_root_full_path: false
            show_source: false
            signature_crossrefs: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

extra:
  release: 0.1.0a3
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/kj-9/kazeflow
      name: kazeflow on GitHub

copyright: Released under the MIT License.

nav:
  - Overview: index.md
  - Get started: getting-started.md
  - Guides:
      - guides/index.md
      - Assets and dependencies: guides/assets-and-dependencies.md
      - Partitions: partitions.md
      - Rich progress: guides/tui.md
      - SQLite persistence: guides/persistence.md
  - Concepts:
      - concepts/index.md
      - Plan, result, and events: concepts/planning-results-events.md
      - Failure semantics: concepts/failure-semantics.md
      - Trust boundary: concepts/trust-boundary.md
  - CLI reference:
      - cli.md
      - assets: cli/assets.md
      - partitions: cli/partitions.md
      - plan: cli/plan.md
      - run: cli/run.md
      - runs history: cli/history.md
      - Exit codes and automation: cli/exit-codes.md
      - JSON automation contract: cli/json.md
  - Python API:
      - api/index.md
      - Core API: api/core.md
      - Plans and results: api/plans-results.md
      - Events: api/events.md
      - SQLite adapter: api/sqlite.md
  - Examples:
      - examples/index.md
      - Small ETL: examples/small-etl.md
      - Partition rerun: examples/partition-rerun.md
      - Failure investigation: examples/failure-investigation.md
  - Results and history: results.md
  - Release 0.1.0a3: releases/compatibility.md
