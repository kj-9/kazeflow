name: Publish documentation site

on:
  pull_request:
    paths:
      - "docs/user/**"
      - "mkdocs.yml"
      - "pyproject.toml"
      - "scripts/check_docs_build.py"
      - "uv.lock"
      - ".github/workflows/pages.yml"
  push:
    branches: [main]
    paths:
      - "docs/user/**"
      - "mkdocs.yml"
      - "pyproject.toml"
      - "scripts/check_docs_build.py"
      - "uv.lock"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Build documentation strictly
        run: uv run --frozen --group docs mkdocs build --strict
      - name: Check generated documentation contract
        run: uv run --frozen python scripts/check_docs_build.py build/docs-site
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/docs-site

  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
